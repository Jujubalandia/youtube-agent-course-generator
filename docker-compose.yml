# Docker Compose launcher for youtube-agent-course-generator
#
# Spins up the full local stack that previously required a manual venv, npm
# install and a bare `docker run` Jaeger:
#
#   postgres  - course/JSONB persistence (schema auto-created on first start)
#   minio     - local S3-compatible storage for extracted frame images
#   minio-init- one-shot: creates the bucket and makes it publicly readable
#   jaeger    - OpenTelemetry/OTLP trace collector + UI
#   backend   - FastAPI + LangGraph agent (Python 3.10 image, CPU PyTorch)
#   frontend  - React SPA served by nginx on port 3000
#
# Quick start:
#   cp .env.example .env    # then fill in GEMINI_API_KEY and GROQ_API_KEY
#   docker compose up -d --build
#
# URLs (host): frontend http://localhost:3000 · backend http://localhost:8000
#              Jaeger http://localhost:16686 · MinIO console http://localhost:9001

name: youtube-agent-course-generator

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-course}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-course}
      POSTGRES_DB: ${POSTGRES_DB:-coursegen}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U '${POSTGRES_USER:-course}' -d '${POSTGRES_DB:-coursegen}'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API (frame image URLs are served from here)
      - "9001:9001"   # MinIO web console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # One-shot bucket bootstrap. Uses the same credentials the backend will use
  # (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY default to the MinIO root creds).
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-course-frames}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing \"local/$$S3_BUCKET_NAME\" &&
      mc anonymous set download \"local/$$S3_BUCKET_NAME\" &&
      echo 'MinIO bucket $$S3_BUCKET_NAME ready (public-read for local image serving)'"
    restart: "no"

  # FiftyOne's frame-dedup (compute_uniqueness) needs MongoDB. Its embedded
  # `fiftyone-db` binary is unreliable inside this image, so we run a real Mongo
  # and point FiftyOne at it via FIFTYONE_DATABASE_URI.
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      # OTLP ingest stays internal (4317 gRPC / 4318 HTTP) unless you publish it
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    image: youtube-agent-course-generator-backend:local
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    environment:
      # Mandatory: the LangGraph agent module refuses to import without these.
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env (see .env.example)}
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in .env (see .env.example)}
      # LLM models (override if a provider retires/renames a model).
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GROQ_MODEL: ${GROQ_MODEL:-meta-llama/llama-4-scout-17b-16e-instruct}
      # Database (asyncpg driver). Override DATABASE_URL wholesale if you want.
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-course}:${POSTGRES_PASSWORD:-course}@postgres:5432/${POSTGRES_DB:-coursegen}}"
      # Object storage. Defaults below wire up the bundled MinIO; to use real
      # AWS S3 instead, set S3_ENDPOINT_URL= and S3_PUBLIC_URL= (empty) in .env
      # together with your AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / bucket.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-course-frames}
      S3_ENDPOINT_URL: "${S3_ENDPOINT_URL-http://minio:9000}"
      S3_PUBLIC_URL: "${S3_PUBLIC_URL-http://localhost:9000}"
      # Tracing -> bundled Jaeger (override to disable, e.g. OTEL_EXPORTER_OTLP_ENDPOINT=)
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT-http://jaeger:4317}"
      # FiftyOne (keyframe uniqueness) uses the bundled MongoDB service.
      FIFTYONE_DATABASE_URI: mongodb://mongo:27017
    volumes:
      - whisper_cache:/root/.cache/whisper
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5).status == 200 else 1)"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 120s   # first start imports torch/fiftyone; can take a while
    restart: unless-stopped

  # One-shot DB schema init (creates the `courses` table; upstream never ran
  # create_all). Runs against the same image as `backend`.
  backend-init:
    image: youtube-agent-course-generator-backend:local
    command: ["python", "scripts/init_db.py"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-course}:${POSTGRES_PASSWORD:-course}@postgres:5432/${POSTGRES_DB:-coursegen}}"
    restart: "no"

  frontend:
    build:
      context: ./frontend
      args:
        # Must stay on port 3000 unless you also extend CORS on the backend
        # (app/api/main.py allow_origins currently allows http://localhost:3000).
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ | grep -q 'id=\"root\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  minio_data:
  whisper_cache:
  mongo_data:
